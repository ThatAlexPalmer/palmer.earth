name: Nest stats daily refresh

on:
    schedule:
        - cron: "0 0 * * *" # midnight UTC
    workflow_dispatch: {}

concurrency:
    group: nest-stats-refresh
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    refresh:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Refresh Nest stats snapshot
              run: pnpm nest:refresh

            - name: Commit snapshot if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/nest-stats.json
                  if git diff --staged --quiet; then
                    echo "No snapshot changes"
                    exit 0
                  fi
                  git commit -m "chore(nest): refresh daily stats snapshot"
                  git push
